product:
  type: kmp/lib
  platforms: [ jvm, android, js, wasmJs ]

aliases:
  nonWeb: [ jvm, android ]

apply:
  - //publishing.module-template.yaml

dependencies:
  - //ui: exported

dependencies@nonWeb:
  - $compose.ui
  - $compose.foundation

dependencies@web:
  - $libs.kotlin.wrappers.browser

settings:
  compose:
    enabled: true
  publishing:
    artifactId: foundation