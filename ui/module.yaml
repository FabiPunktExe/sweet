product:
  type: kmp/lib
  platforms: [ jvm, android, js, wasmJs ]

aliases:
  nonWeb: [ jvm, android ]

apply: 
  - //publishing.module-template.yaml

dependencies@nonWeb:
  - $compose.ui

dependencies@web:
  - $libs.kotlin.wrappers.browser

settings:
  compose:
    enabled: true
  publishing:
    artifactId: ui

settings@wasmJs:
  kotlin:
    optIns:
      - kotlin.js.ExperimentalWasmJsInterop