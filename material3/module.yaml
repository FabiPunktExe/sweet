product:
  type: kmp/lib
  platforms: [ jvm, android, js, wasmJs ]

aliases:
  nonWeb: [ jvm, android ]

apply:
  - //publishing.module-template.yaml

dependencies:
  - //ui: exported
  - //foundation: exported
  - $libs.materialkolor.colorUtilities

dependencies@nonWeb:
  - $compose.ui
  - $compose.material3

dependencies@web:
  - $libs.kotlin.wrappers.browser

settings:
  compose:
    enabled: true
  publishing:
    artifactId: material3

settings@wasmJs:
  kotlin:
    optIns:
      - kotlin.js.ExperimentalWasmJsInterop