repositories:
  - id: diruptioPublic
    url: https://repo.diruptio.de/repository/maven-public-releases
    resolve: false
    publish: true
    credentials:
      file: //local.properties
      usernameKey: diruptio_repo_username
      passwordKey: diruptio_repo_password

settings:
  publishing:
    enabled: true
    group: de.fabiexe.sweet
    version: 0.1.0